[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qbs-reproduction"
version = "0.1.0"
description = "Independent quadratic Bezier stroke rendering and audit-guided optimization in PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "gulucaptain"}]
dependencies = [
  "torch>=2.6", "torchvision>=0.21", "timm>=1.0",
  "numpy>=1.26", "scipy>=1.11", "Pillow>=10",
  "matplotlib>=3.8", "scikit-image>=0.22"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
qbs-fit = "qbs.experiment:main"
qbs-suite = "qbs.suite:main"
qbs-prepare-data = "qbs.prepare_data:main"
qbs-report = "qbs.report:main"
qbs-train = "qbs.train:main"

[project.urls]
Repository = "https://github.com/gulucaptain/Quadratic-Bezier-Splatting-Reproduction"
Issues = "https://github.com/gulucaptain/Quadratic-Bezier-Splatting-Reproduction/issues"

[tool.setuptools.packages.find]
include = ["qbs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
